name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js admin.js sw.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Check that every script referenced by index.html exists
        run: |
          for f in $(grep -o 'src="[^"]*\.js"' index.html | sed 's/src="//;s/"//'); do
            test -f "$f" || { echo "Falta $f"; exit 1; }
          done
